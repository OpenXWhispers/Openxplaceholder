
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OpenX</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <meta name="description" content="A little about me and how to get in touch.">

  <style>
    :root {
      --bg: #30232D;
      --plum: #624451;
      --rose: #B68F98;
      --champagne: #E8D5C9;
      --ivory: #F3EAE4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background:
        radial-gradient(
          ellipse at 18% 15%,
          #795464 0%,
          transparent 48%
        ),
        radial-gradient(
          ellipse at 90% 90%,
          #503849 0%,
          transparent 45%
        ),
        var(--bg);
      color: var(--ivory);
      font-family: "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    /* Soft decorative rings */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 440px;
      height: 440px;
      border: 1px solid #E8D5C91A;
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      top: -270px;
      right: -150px;
    }

    body::after {
      bottom: -330px;
      left: -160px;
      width: 540px;
      height: 540px;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      text-align: center;
      animation: fade-in 1.5s ease both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 32px;
      color: var(--champagne);
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 30px;
      height: 1px;
      background: var(--rose);
      opacity: 0.8;
    }

    h1 {
      font-family: "Bodoni MT", Didot, Georgia, serif;
      font-size: clamp(3.3rem, 10vw, 6.5rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--ivory);
    }

    .ornament {
      margin: 28px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      color: #E8D5C9;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      -webkit-text-fill-color: #E8D5C9;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      width: 40px;
      height: 1px;
      background: var(--rose);
      opacity: 0.7;
    }

    .description {
      color: #E8D5C9B8;
      font-family: Georgia, serif;
      font-size: 1.05rem;
      font-style: italic;
      letter-spacing: 0.025em;
      line-height: 1.9;
    }

    .contact {
      margin-top: 54px;
    }

    .contact-label {
      margin-bottom: 18px;
      color: var(--rose);
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .email {
      display: inline-block;
      padding: 14px 24px;
      border: 1px solid #E8D5C946;
      border-radius: 2px;
      color: var(--ivory);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        color 0.3s ease;
    }

    .email:hover {
      background: #E8D5C912;
      border-color: var(--champagne);
      color: var(--champagne);
    }

    footer {
      margin-top: 76px;
      color: #E8D5C96B;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 24px;
      }

      h1 {
        font-size: clamp(3rem, 14vw, 4.5rem);
      }

      .description {
        font-size: 0.95rem;
      }

      .email {
        font-size: 0.78rem;
        padding: 13px 15px;
        letter-spacing: 0.04em;
      }

      footer {
        margin-top: 60px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
      }

      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
<main>
  <p class="eyebrow">A personal space</p>

  <h1>OpenX</h1>

  <div class="ornament" aria-hidden="true">✳</div>

  <p class="description">
    More to come, in time.
  </p>

  <section class="contact" aria-label="Contact">
    <p class="contact-label">Correspondence</p>

    <a class="email" href="mailto:openxwhispers@gmail.com">openxwhispers@gmail.com
    </a>
  </section>

  <footer>
    © <span id="year"></span> OpenX
  </footer>
</main>

<script>
  document.getElementById("year").textContent =
    new Date().getFullYear();
</script>
</body>
</html>
